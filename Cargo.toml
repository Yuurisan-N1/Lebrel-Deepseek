[package]
name = "lebrel-bot"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[[bin]]
name = "lebrel-bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = "0.4"
ed25519-dalek = "2"
base64 = "0.22"
rand = "0.8"
bs58 = "0.5"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }